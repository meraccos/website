<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:image" content="https://merajmammadov.com/media/hangman/preview.png" />

    <meta property="og:image:alt" content="Hand-drawn letter puzzle for Information-Theoretic Hangman." />

  <title>Information-Theoretic Hangman | Meraj Mammadov</title>
    <link rel="canonical" href="https://merajmammadov.com/hangman/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/fonts.css?v=1fe80119e6" />
    <link rel="stylesheet" href="/css/layout.css?v=97d5192710" />
  <link rel="stylesheet" href="/css/content.css?v=8ac3ee3eaf" />
  <link rel="stylesheet" href="/hangman/hangman.css?v=f3a08b642e" />
  <script src="/js/site.js?v=ffd2e4b681" defer></script>
  <script src="/hangman/hangman.js?v=be0108c42e" defer></script>
</head>
  <body>
    <header>
      <p class="site-title"><a href="/">Meraj Mammadov</a></p>
      <nav class="nav" aria-label="Main navigation">

        <a href="/" class="desktop">home</a>
        <a href="/cv.pdf" class="desktop">cv</a>

        <a href="/projects/" class="desktop">projects</a>

        <a href="/enigma/" class="desktop">enigma</a>
        <a href="/quotes/" class="desktop">quotes</a>
        <button id="mobile-menu-btn" class="menu-button mobile" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
          <span class="line" style="width: 26px;" aria-hidden="true"></span>
          <span class="line" style="width: 20px;" aria-hidden="true"></span>
        </button>

      </nav>

      <div class="mobile-menu" id="mobile-menu" hidden>
        <a href="/" class="mobile">home</a>
        <a href="/cv.pdf" class="mobile">cv</a>
        <a href="/projects/" class="mobile">projects</a>
        <a href="/enigma/" class="mobile">enigma</a>
        <a href="/quotes/" class="mobile">quotes</a>
      </div>
    </header>

    <main class="project-page">
      <div class="section-heading">
        <h1>Information-Theoretic Hangman</h1>
      </div>
      <section class="content">
        <p>

          Think of a word. The computer chooses each guess to reduce uncertainty as quickly as possible.
        </p>
      </section>
      <section class="hangman" aria-label="Hangman game">
        <div class="settings">
          <div class="setup-actions">
            <div class="setting">
              <label for="num_of_chars_box">Word length</label>
              <input type="number" min="4" max="18" step="1" inputmode="numeric" class="num_of_chars_box" id="num_of_chars_box" placeholder="7" />
            </div>
            <button class="button" id="start-button" onclick="startGame()">Start</button>
          </div>
        </div>

        <p class="game-hint" id="hangman-status" role="status"></p>
        <div class="play-instructions hide_at_start" id="dt2">
          <p class="game-hint">Mark every match, then continue.</p>
        </div>

        <div class="display hide_at_start">
          <button class="letter" id="letter1" aria-label="Position 1" aria-pressed="false" onclick="replaceLetter('1')">_</button>
          <button class="letter" id="letter2" aria-label="Position 2" aria-pressed="false" onclick="replaceLetter('2')">_</button>
          <button class="letter" id="letter3" aria-label="Position 3" aria-pressed="false" onclick="replaceLetter('3')">_</button>
          <button class="letter" id="letter4" aria-label="Position 4" aria-pressed="false" onclick="replaceLetter('4')">_</button>
          <button class="letter" id="letter5" aria-label="Position 5" aria-pressed="false" onclick="replaceLetter('5')">_</button>
          <button class="letter" id="letter6" aria-label="Position 6" aria-pressed="false" onclick="replaceLetter('6')">_</button>
          <button class="letter" id="letter7" aria-label="Position 7" aria-pressed="false" onclick="replaceLetter('7')">_</button>
          <button class="letter" id="letter8" aria-label="Position 8" aria-pressed="false" onclick="replaceLetter('8')">_</button>
          <button class="letter" id="letter9" aria-label="Position 9" aria-pressed="false" onclick="replaceLetter('9')">_</button>
          <button class="letter" id="letter10" aria-label="Position 10" aria-pressed="false" onclick="replaceLetter('10')">_</button>
          <button class="letter" id="letter11" aria-label="Position 11" aria-pressed="false" onclick="replaceLetter('11')">_</button>
          <button class="letter" id="letter12" aria-label="Position 12" aria-pressed="false" onclick="replaceLetter('12')">_</button>
          <button class="letter" id="letter13" aria-label="Position 13" aria-pressed="false" onclick="replaceLetter('13')">_</button>
          <button class="letter" id="letter14" aria-label="Position 14" aria-pressed="false" onclick="replaceLetter('14')">_</button>
          <button class="letter" id="letter15" aria-label="Position 15" aria-pressed="false" onclick="replaceLetter('15')">_</button>
          <button class="letter" id="letter16" aria-label="Position 16" aria-pressed="false" onclick="replaceLetter('16')">_</button>
          <button class="letter" id="letter17" aria-label="Position 17" aria-pressed="false" onclick="replaceLetter('17')">_</button>
          <button class="letter" id="letter18" aria-label="Position 18" aria-pressed="false" onclick="replaceLetter('18')">_</button>
        </div>


        <div class="guess_and_cost">
          <div class="game_status_and_guess hide_at_start">
            <div class="mobile-current-guess hide_at_start">
              <p>Guess:</p>
              <p id="mobile-guessed-letter">_</p>
            </div>
            <div class="cost hide_at_start">
              <p class="hide_at_start">Misses</p>
              <p class="hide_at_start" id="cost">0</p>
            </div>

            <div class="entropy hide_at_start" title="Uncertainty over the remaining words">
              <p class="hide_at_start">Entropy</p>
              <p class="hide_at_start" id="entropy">0</p>
            </div>

          </div>
          <button class="button hide_at_start" id="guess-button" onclick="guessNext()">
            <span class="desktop-guess-label">Next guess</span>
            <span class="mobile-guess-label">Continue</span>
            <span id="guessed-letter" aria-live="polite">_</span>
          </button>
        </div>
      </section>
    </main>
    <footer>
      <p>&copy; <span data-copyright-year>2026</span> Meraj Mammadov</p>
    </footer>
  </body>
</html>
