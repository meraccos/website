<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Noise</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/noise/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Noise">
  <meta name="theme-color" content="#111111">
  <style>
    html,body { margin:0; min-height:100%; background:#111; color:#aaa; }
    body { min-height:100svh; display:grid; place-items:center; font:16px system-ui,sans-serif; }
    button { padding:16px 24px; border:1px solid #444; border-radius:8px; background:transparent; color:inherit; font:inherit; cursor:pointer; }
    button[hidden] { display:none; }
    button:focus-visible { outline:2px solid #8ab4e8; outline-offset:4px; }
    .playback { position:fixed; left:50%; top:calc(50% + 90px); transform:translateX(-50%); width:56px; height:56px; padding:0; display:grid; place-items:center; border-radius:22px; border:1px solid #dce6fa18; background:#222b3b; color:#e4e6de; box-shadow:0 4px 24px #8aa8de0c,inset 0 1px #ffffff08; transition:background .2s,box-shadow .2s; }
    .playback:hover { background:#2b364a; box-shadow:0 4px 28px #8aa8de18; }
    .playback svg { width:36px; height:36px; }
    .sleep { position:relative; width:100px; height:120px; display:none; user-select:none; pointer-events:none; }
    body.is-playing .sleep { display:block; }
    .sleep span { position:absolute; bottom:16px; left:22px; color:#8190a5; font-size:28px; font-weight:300; opacity:0; animation:drift 6s linear infinite; }
    .sleep span:nth-child(2) { animation-delay:2s; }
    .sleep span:nth-child(3) { animation-delay:4s; }
    @keyframes drift {
      0% { opacity:0; transform:translate(0,0) scale(.7) rotate(-8deg); }
      20% { opacity:.45; }
      70% { opacity:.3; }
      100% { opacity:0; transform:translate(36px,-80px) scale(1.15) rotate(8deg); }
    }
    @media (prefers-reduced-motion:reduce) {
      .sleep span { animation:none; opacity:.35; position:static; }
      .sleep { align-content:center; text-align:center; }
    }
  </style>
</head>
<body>
  <button id="start" hidden>Tap to play noise</button>
  <div class="sleep" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div>
  <button class="playback" id="pause" aria-label="Pause noise" hidden><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M26 7a14 14 0 1 0 7 23A15 15 0 0 1 26 7Z" fill="currentColor"/><path d="M11 22q2 2 4 0m4 0q2 2 4 0" fill="none" stroke="#566078" stroke-width="1.5" stroke-linecap="round"/><path d="m31 8 1 3 3 1-3 1-1 3-1-3-3-1 3-1Z" fill="#a9bfd4"/></svg></button>
  <audio id="audio" src="/noise/continuous.m4a" loop preload="auto"></audio>
  <script>
    const button = document.getElementById('start');
    const audio = document.getElementById('audio');
    const pauseButton = document.getElementById('pause');
    pauseButton.addEventListener('click', () => audio.pause());
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: 'Noise' });
      navigator.mediaSession.setActionHandler('play', play);
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    }
    async function play() {
      try {
        await audio.play();
        button.hidden = true;
      } catch {
        button.hidden = false;
      }
    }
    audio.addEventListener('playing', () => {
      button.hidden = true;
      pauseButton.hidden = false;
      document.body.classList.add('is-playing');
    });
    audio.addEventListener('pause', () => {
      button.hidden = false;
      button.textContent = 'Resume noise';
      pauseButton.hidden = true;
      document.body.classList.remove('is-playing');
    });
    audio.addEventListener('error', () => {
      pauseButton.hidden = true;
      document.body.classList.remove('is-playing');
      button.textContent = 'Tap to retry';
      button.hidden = false;
    });
    button.addEventListener('click', play);
    play();
  </script>
</body>
</html>
