    <main class="quotes-page">
      <div class="section-heading">
        <h1>Quotes</h1>
      </div>
      <p class="content">A collection of quotes that sounded profound when I saved them.</p>

      <div class="quote-list">
        <figure class="quote-entry">
          <blockquote>
          <p>“It’s through logic that we prove, but through intuition that we discover.”</p>
          </blockquote>
          <figcaption>Henri Poincaré</figcaption>
        </figure>

        <figure class="quote-entry">
          <blockquote>
          <p>
            “About the use of language: it is impossible to sharpen a pencil with a blunt axe. It is
            equally vain to try to do it with ten blunt axes instead.”
          </p>
          </blockquote>
          <figcaption>Edsger Dijkstra</figcaption>
        </figure>

        <figure class="quote-entry">
          <blockquote>
          <p>
            “You know how advice is. You only want it if it agrees with what you wanted to do anyway.”
          </p>
          </blockquote>
          <figcaption>John Steinbeck</figcaption>
        </figure>

        <figure class="quote-entry">
          <blockquote>
          <p>“Do not solve a more general problem as an intermediate step.”</p>
          </blockquote>
          <figcaption>Vladimir Vapnik</figcaption>
        </figure>

        <figure class="quote-entry">
          <blockquote>
          <p>“When a measure becomes a target, it ceases to be a good measure.”</p>
          </blockquote>
          <figcaption>Marilyn Strathern</figcaption>
        </figure>

        <figure class="quote-entry">
          <blockquote>
          <p>“To see what is in front of one’s nose needs a constant struggle.”</p>
          </blockquote>
          <figcaption>George Orwell</figcaption>
        </figure>

        <figure class="quote-entry">
          <blockquote>
          <p>“We judge others by their behavior. We judge ourselves by our intentions.”</p>
          </blockquote>
          <figcaption>Ian Percy</figcaption>
        </figure>

        <figure class="quote-entry">
          <blockquote>
          <p>“Belief is not the beginning of knowledge—it is the end.”</p>
          </blockquote>
          <figcaption>Johann Wolfgang von Goethe</figcaption>
        </figure>
