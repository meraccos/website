    <main class="project-page">
      <div class="section-heading">
        <h1>Small Language Models</h1>
      </div>
      <p class="content">
        Generate text with Bigram and LSTM models trained on Nizami Ganjavi’s works in Azerbaijani and William Shakespeare’s works in English.
      </p>

      <div class="language-model">
      <div class="model-controls">
      <div class="control-group">
      <p class="control-label" id="model-label">Model</p>

      <div class="switch" id="switch1" role="group" aria-labelledby="model-label">
        <button
          onclick="switchModel('bigram')"
          class="button"
          id="bigram-button"
        >
          Bigram
        </button>
        <button
          onclick="switchModel('lstm')"
          class="button"
          id="lstm-button"
        >
          LSTM
        </button>
      </div>

      </div>
      <div class="control-group">
      <p class="control-label" id="dataset-label">Dataset</p>

      <div class="switch" id="switch2" role="group" aria-labelledby="dataset-label">
        <button
          onclick="switchDataset('nizami')"
          class="button"
          id="nizami-button"
        >
          Nizami
        </button>
        <button
          onclick="switchDataset('shakespeare')"
          class="button"
          id="shakespeare-button"
        >
          Shakespeare
        </button>
      </div>

      </div>
      <div class="control-group generation-group">
      <label class="control-label" for="inputText">Characters to generate</label>

      <div class="generator" id="generator">
        <input
          type="text"
          class="input_box"
          id="inputText"
          maxlength="4"
          inputmode="numeric"
          value="200"
        />
        <button
          onclick="generateText()"
          class="button gen"
          id="generate_button"
        >
          Generate
        </button>
        </div>
        </div>
        </div>
        <p id="generation-status" class="generation-status" role="status"></p>
        <p id="output" class="output_box" aria-label="Generated text"></p>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.min.js" integrity="sha384-Gcu8U60SCeoyIiwfPwFy+eRexUuRRE9UYEXcm6vLDFVkGxcB1kk/gTv9FKTgoA6h" crossorigin="anonymous"></script>
    <script src="/js/onnx-config.js?v=fde83898fb"></script>
